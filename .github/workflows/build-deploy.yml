name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/build-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 567274077914.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: ipoint-critica-prod
  ROLE_ARN: arn:aws:iam::567274077914:role/ipoint-prod-github-actions-critica

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    # DISABLED: pushes to an ECR repo/role that no longer exists post-GKE-
    # cutover -- this was a silent green no-op. GKE apps (critica-staging/
    # prod) run from ipoint-infra-ar via .github/workflows/deploy-gke.yml,
    # which is what actually ships critica now. Left in place (not deleted)
    # pending an operator decision to remove AWS entirely.
    if: false
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  bump-staging:
    needs: build
    runs-on: ubuntu-latest
    # DISABLED: see the `build` job above -- same dead-AWS reasoning; this
    # job would also never run today since `build` never completes, but
    # marking it explicitly in case that changes.
    if: false
    steps:
      - uses: actions/checkout@v5

      - name: Install kustomize
        run: |
          curl -sLo kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Bump newTag in staging overlay
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}
        run: |
          (cd k8s/overlays/staging && kustomize edit set image "critica=${IMAGE}")
          git --no-pager diff k8s/overlays/staging/

      - name: Commit + push
        run: |
          if git diff --quiet k8s/overlays/staging/; then
            echo "kustomize already at this tag; nothing to commit"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging/kustomization.yaml
          git commit -m "chore: deploy staging to ${{ needs.build.outputs.image_tag }}"
          git push
