name: Deploy Staging (GKE)

# GCP counterpart of build-deploy.yml. Builds the image, pushes to the shared
# Artifact Registry via keyless Workload Identity Federation (no stored
# credentials), then bumps the GKE staging overlay so ArgoCD on the GKE
# cluster syncs it.
#
# build-deploy.yml (AWS/ECR) is legacy: it pushes to an ECR repo/role that no
# longer exists post-cutover, so its jobs are disabled (if: false) below. The
# GKE apps (critica-staging/prod) actually run whatever was last pushed
# manually to :latest in ipoint-infra-ar — this workflow is what keeps that in
# sync with main going forward.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'k8s/**'
      - '!k8s/overlays/staging-gke/kustomization.yaml' # avoid retriggering on our own commit-back
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy-gke.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging-gke
  cancel-in-progress: true

permissions:
  id-token: write # required for the GitHub OIDC token WIF exchanges
  contents: write # for the kustomize image-tag commit-back

env:
  AR_REGISTRY: us-central1-docker.pkg.dev
  AR_IMAGE: us-central1-docker.pkg.dev/ipointai-infra/ipoint-infra-ar/critica
  GCP_PROJECT: ipointai-infra
  WIF_PROVIDER: projects/285610187390/locations/global/workloadIdentityPools/ipoint-infra-github/providers/github

jobs:
  deploy:
    name: Deploy to Staging (GKE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Direct WIF: no service account, no keys. The federated identity itself
      # holds roles/artifactregistry.writer on ipoint-infra-ar (see the infra
      # repo, gcp/infra/github_wif.tf).
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.AR_REGISTRY }} --quiet

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.AR_IMAGE }}:${{ github.sha }}
            ${{ env.AR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Update staging-gke kustomization image tag
        run: |
          cd k8s/overlays/staging-gke
          kustomize edit set image "critica=${{ env.AR_IMAGE }}:${{ github.sha }}"

      - name: Commit and push
        run: |
          if git diff --quiet k8s/overlays/staging-gke/; then
            echo "kustomize already at this tag; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/staging-gke/kustomization.yaml
          git commit -m "chore: deploy staging-gke to ${{ github.sha }}"
          # Retry on push failure — build-deploy.yml (AWS, if ever re-enabled) /
          # deploy-production.yml can race us committing back to main on the
          # same push.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying..."
            sleep $((attempt * 2))
          done
          echo "push failed after 5 attempts" >&2
          exit 1
