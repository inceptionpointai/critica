apiVersion: apps/v1
kind: Deployment
metadata:
  name: critica
  labels:
    app: critica
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: critica
  template:
    metadata:
      labels:
        app: critica
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - critica
                topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: critica
      terminationGracePeriodSeconds: 30
      containers:
        - name: critica
          image: critica:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: critica-config
            - secretRef:
                name: critica-secrets
                optional: true
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp/critica
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
