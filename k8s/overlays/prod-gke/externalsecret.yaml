apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critica-secrets
spec:
  refreshInterval: 1h
  # GKE variant: GCP Secret Manager via the namespace-scoped SecretStore that
  # ESO exposes in staging (Phase 4a). AWS overlay uses aws-parameter-store.
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: critica-secrets
    creationPolicy: Owner
  data:
    # remoteRef keys are GCP Secret Manager secret IDs (hyphenated), vs the AWS
    # SSM paths (/prod/critica/*). secretKey (the env var) is unchanged.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: critica-anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: critica-openai-api-key
    - secretKey: SPREAKER_API_KEY
      remoteRef:
        key: critica-spreaker-api-key
    - secretKey: SPREAKER_USER_ID
      remoteRef:
        key: critica-spreaker-user-id
    # INTENTIONAL: no MEGAPHONE_API_TOKEN in staging (prod-only flow). Carried
    # over from the AWS overlay unchanged: /api/v1/review/megaphone exists in the
    # staging pod but 502s with "MEGAPHONE_API_TOKEN not set" if called.
    - secretKey: CRITICA_API_KEYS
      remoteRef:
        key: critica-api-keys
    # INTENTIONAL: no ANALYTICS_DB_URL in staging. The critica.episode_reviews
    # schema lives ONLY in the prod analytics-db; staging has no analytics-db
    # cluster, and the fail-open sink in app/db.py logs "sink disabled" and keeps
    # serving. Do NOT add a key here.
