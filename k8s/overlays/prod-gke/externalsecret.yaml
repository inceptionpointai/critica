apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critica-secrets
spec:
  refreshInterval: 1h
  # GKE variant: GCP Secret Manager via the namespace-scoped SecretStore that
  # ESO exposes in staging (Phase 4a). AWS overlay uses aws-parameter-store.
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: critica-secrets
    creationPolicy: Owner
  data:
    # remoteRef keys are GCP Secret Manager secret IDs (hyphenated), vs the AWS
    # SSM paths (/prod/critica/*). secretKey (the env var) is unchanged.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: critica-anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: critica-openai-api-key
    - secretKey: SPREAKER_API_KEY
      remoteRef:
        key: critica-spreaker-api-key
    - secretKey: SPREAKER_USER_ID
      remoteRef:
        key: critica-spreaker-user-id
    # Megaphone — org-wide token, prod-only flow. The AWS prod overlay mapped
    # /prod/shared/megaphone-api-token; GSM equivalent is shared-megaphone-api-token.
    # (This entry was missing after the overlay was copied from staging-gke —
    # the "INTENTIONAL: no MEGAPHONE_API_TOKEN in staging" note is only true
    # for staging. It broke analytics-etl-critica-megaphone-producer hourly.)
    - secretKey: MEGAPHONE_API_TOKEN
      remoteRef:
        key: shared-megaphone-api-token
    - secretKey: CRITICA_API_KEYS
      remoteRef:
        key: critica-api-keys
    # Review sink → critica.episode_reviews (dashboard 39), prod-only (no
    # staging analytics-db). critica_writer is a CNPG managed role whose
    # password lives in GSM (infrastructure main @ 1a01879, same pattern as
    # qualitas_writer); the url secret carries the full DSN. Without this
    # mapping the fail-open sink logs "sink disabled" and reviews are
    # scored but never recorded.
    - secretKey: ANALYTICS_DB_URL
      remoteRef:
        key: critica-analytics-db-url
