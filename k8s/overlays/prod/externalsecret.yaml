apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critica-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: critica-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /prod/critica/anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /prod/critica/openai-api-key
    - secretKey: SPREAKER_API_KEY
      remoteRef:
        key: /prod/critica/spreaker-api-key
    - secretKey: CRITICA_API_KEYS
      remoteRef:
        key: /prod/critica/api-keys
    - secretKey: ANALYTICS_DB_URL
      remoteRef:
        key: /prod/critica/analytics-db-url
