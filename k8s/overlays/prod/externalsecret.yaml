apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critica-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: critica-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /prod/critica/anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /prod/critica/openai-api-key
    - secretKey: SPREAKER_API_KEY
      remoteRef:
        key: /prod/critica/spreaker-api-key
    - secretKey: SPREAKER_USER_ID
      remoteRef:
        key: /prod/critica/spreaker-user-id
    # Megaphone — org-wide token under /prod/shared. The prod ESO IRSA
    # (irsa.tf:223-248) already allows /prod/*, so no IAM change is needed.
    - secretKey: MEGAPHONE_API_TOKEN
      remoteRef:
        key: /prod/shared/megaphone-api-token
    - secretKey: CRITICA_API_KEYS
      remoteRef:
        key: /prod/critica/api-keys
    - secretKey: ANALYTICS_DB_URL
      remoteRef:
        key: /prod/critica/analytics-db-url
