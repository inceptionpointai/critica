apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critica-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: critica-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /staging/critica/anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /staging/critica/openai-api-key
    - secretKey: SPREAKER_API_KEY
      remoteRef:
        key: /staging/critica/spreaker-api-key
    - secretKey: SPREAKER_USER_ID
      remoteRef:
        key: /staging/critica/spreaker-user-id
    # INTENTIONAL: no MEGAPHONE_API_TOKEN in staging.
    # Megaphone-sourced reviews are a prod-only flow — /api/v1/review/megaphone
    # exists in the staging pod but will 502 with "MEGAPHONE_API_TOKEN not set"
    # if called. Same pattern as the absent ANALYTICS_DB_URL below: staging
    # deliberately under-wires features that the team isn't validating there.
    # To enable: create /staging/shared/megaphone-api-token and re-add the key.
    - secretKey: CRITICA_API_KEYS
      remoteRef:
        key: /staging/critica/api-keys
    # INTENTIONAL: no ANALYTICS_DB_URL in staging.
    # The critica.episode_reviews schema lives ONLY in prod analytics-db
    # (analytics-db-rw.prod.svc.cluster.local). Staging has no analytics-db
    # CNPG cluster, and NetworkPolicies in both namespaces forbid
    # cross-namespace 5432 traffic. The fail-open sink in app/db.py logs
    # "sink disabled — ANALYTICS_DB_URL not set" and /review continues
    # serving — this is the staging-pass condition. Do NOT add a key here.
