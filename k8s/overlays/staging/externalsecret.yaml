apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: critica-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore
  target:
    name: critica-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /staging/critica/anthropic-api-key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /staging/critica/openai-api-key
    - secretKey: SPREAKER_API_KEY
      remoteRef:
        key: /staging/critica/spreaker-api-key
    - secretKey: SPREAKER_USER_ID
      remoteRef:
        key: /staging/critica/spreaker-user-id
    - secretKey: CRITICA_API_KEYS
      remoteRef:
        key: /staging/critica/api-keys
    # No ANALYTICS_DB_URL — staging has no critica schema (sink stays disabled)
